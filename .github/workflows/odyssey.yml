name: Odyssey CI and release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

env:
  # Each job explicitly installs its own tool subset with mise-action.
  MISE_TASK_RUN_AUTO_INSTALL: "false"

# Superseded PR/main checks can stop; a tagged release must finish publishing.
concurrency:
  group: odyssey-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: build (ubuntu-24.04)
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout v7.0.1; action.yml runs on node24.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ startsWith(github.ref, 'refs/tags/v') && '0' || '1' }}
          persist-credentials: false

      # jdx/mise-action v5.1.1; action.yml runs on node24.
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        # zizmor: ignore[cache-poisoning] -- Only main saves; GitHub scopes PR caches away from main/releases.
        with:
          version: 2026.10.3
          install_args: --locked
          cache: true
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          # The publisher reads the same Linux tool cache, installing only Java/Python.
          cache_key: "odyssey-mise-v3-{{version}}-{{platform}}-${{ hashFiles('mise.lock') }}"
          github_token: ""

      # Gradle actions v6.4.0; action.yml runs on node24. Only main writes reusable state.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        # zizmor: ignore[cache-poisoning] -- Main-only writes; PR/tag jobs are read-only with GitHub branch isolation.
        with:
          cache-read-only: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

      - name: Verify tag provenance and select mod version
        if: startsWith(github.ref, 'refs/tags/v')
        id: release
        env:
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          git merge-base --is-ancestor "$SHA" origin/main
          version="$(mise run --quiet release-version --tag "$TAG")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build, test, and lint
        env:
          ODYSSEY_VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: mise run ci

      - name: Retain compiled native updater checks
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-updater-tests
          path: build/native-tests/native-updater-tests.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Retain native updater test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: updater-tests-${{ runner.os }}-${{ runner.arch }}
          path: |
            build/test-results/test/TEST-org.odyssey.mod.update.*.xml
            build/test-results/test/TEST-org.odyssey.mod.chat.OdysseyNotificationsTest.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Validate and record the remapped artifact
        env:
          SHA: ${{ github.sha }}
          ODYSSEY_VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: mise run --quiet release-artifact --jar build/libs/odyssey-mod.jar --metadata build/libs/release-artifact.json --source-sha "$SHA"

      # actions/upload-artifact v7.0.2; action.yml runs on node24.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: odyssey-remapped-jar
          path: |
            build/libs/odyssey-mod.jar
            build/libs/release-artifact.json
          if-no-files-found: error
          retention-days: 14

  publisher-preflight:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        # zizmor: ignore[cache-poisoning] -- Main-only no-send check restores trusted main tools and never saves.
        with:
          version: 2026.10.3
          install_args: --locked python
          cache: true
          cache_save: false
          cache_key: "odyssey-mise-v3-{{version}}-{{platform}}-${{ hashFiles('mise.lock') }}"
          github_token: ""

      - name: Authenticate publisher without posting
        run: mise run publisher-preflight

  native:
    name: updater (${{ matrix.runner }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        # zizmor: ignore[cache-poisoning] -- Only main saves; PR/tag jobs consume trusted defaults.
        with:
          version: 2026.10.3
          install_args: --locked java python
          cache: true
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          cache_key: "odyssey-mise-v3-{{version}}-{{platform}}-${{ hashFiles('mise.lock') }}"
          github_token: ""

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-updater-tests
          path: build/native-tests

      - name: Run native updater checks without rebuilding Minecraft
        run: mise run test-native

      - name: Retain native updater test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: updater-tests-${{ runner.os }}-${{ runner.arch }}
          path: build/test-results/native/*.xml
          if-no-files-found: warn
          retention-days: 14

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, native]
    runs-on: ubuntu-24.04
    concurrency:
      group: odyssey-release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    steps:
      # actions/checkout v7.0.1; action.yml runs on node24.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      # jdx/mise-action v5.1.1; action.yml runs on node24.
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        # zizmor: ignore[cache-poisoning] -- Tag-only publisher restores trusted main caches and never saves.
        with:
          version: 2026.10.3
          install_args: --locked java python
          cache: true
          cache_save: false
          cache_key: "odyssey-mise-v3-{{version}}-{{platform}}-${{ hashFiles('mise.lock') }}"
          github_token: ""

      # actions/download-artifact v8.0.1; action.yml runs on node24.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: odyssey-remapped-jar
          path: release-artifact

      - name: Verify promoted artifact
        env:
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          version="$(mise run --quiet release-version --tag "$TAG")"
          mise run --quiet verify-release-artifact --jar release-artifact/odyssey-mod.jar --metadata release-artifact/release-artifact.json --version "$version" --source-sha "$SHA"

      - name: Sign stable update manifest
        if: "!contains(github.ref_name, '-')"
        env:
          TAG: ${{ github.ref_name }}
          ODYSSEY_UPDATE_SIGNING_KEY: ${{ secrets.ODYSSEY_UPDATE_SIGNING_KEY }}
        run: |
          mise run --quiet update-manifest --jar release-artifact/odyssey-mod.jar --tag "$TAG" --output release-artifact/update.manifest
          mise run --quiet sign-update-manifest release-artifact/update.manifest src/main/resources/odyssey-update.pub

      - name: Create release and upload the same runnable JAR
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          assets=(release-artifact/odyssey-mod.jar)
          if [[ "$TAG" != *-* ]]; then
            assets+=(release-artifact/update.manifest release-artifact/update.manifest.sig)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            mkdir -p existing-release-asset
            for asset in "${assets[@]}"; do
              name="${asset##*/}"
              if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fxq "$name"; then
                gh release download "$TAG" --pattern "$name" --dir existing-release-asset
                cmp --silent "$asset" "existing-release-asset/$name"
              else
                gh release upload "$TAG" "$asset"
              fi
            done
          elif [[ "$TAG" == v0.1.0 ]]; then
            gh release create "$TAG" "${assets[@]}" --verify-tag --draft=false --prerelease=false --latest --title "Odyssey $TAG" --notes-file CHANGELOG.md
          elif [[ "$TAG" == *-* ]]; then
            gh release create "$TAG" "${assets[@]}" --verify-tag --draft=false --title "Odyssey $TAG" --notes-from-tag --prerelease --latest=false
          else
            gh release create "$TAG" "${assets[@]}" --verify-tag --draft=false --prerelease=false --latest --title "Odyssey $TAG" --notes-from-tag
          fi

      - name: Announce release to Discord and verify readback
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: mise run --quiet release-announce --tag "$TAG" --repository "$REPOSITORY" --source-sha "$SOURCE_SHA" --jar release-artifact/odyssey-mod.jar
