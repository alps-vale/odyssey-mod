min_version = "2026.10.3"
[settings]
lockfile = true

[tools]
java = "temurin-21.0.12+8.0.LTS"
python = "3.13.16"
actionlint = "1.7.12"
zizmor = "1.30.1"

[env]
ODYSSEY_ANNOUNCEMENTS_URL = { default = "https://odyssey.notes.supply/api/v1/automations/releases/messages" }
ODYSSEY_BACKEND_URL = { default = "https://odyssey.notes.supply" }
ODYSSEY_VERSION = { default = "0.3.2-SNAPSHOT" }
ODYSSEY_DEVELOPMENT = { default = "false" }
ODYSSEY_PRISM_INSTANCE = { default = "odyssey-testing" }
PRISM_ROOT = { default = """\
{% if os() == 'windows' %}{{ env.APPDATA }}\
{% elif os() == 'macos' %}{{ env.HOME }}/Library/Application Support\
{% else %}{{ env.HOME }}/.local/share{% endif %}/PrismLauncher""" }

[tasks.default]
description = "Run the complete local CI check without touching a game instance"
depends = ["ci"]

[tasks.workflow-lint]
description = "Lint GitHub Actions workflow security and syntax"
run = ["actionlint .github/workflows/odyssey.yml", "zizmor .github/workflows/odyssey.yml"]

[tasks.test]
description = "Run Odyssey unit tests"
run = "./gradlew test"
run_windows = "cmd.exe /d /c gradlew.bat test"

[tasks.test-item-render]
description = "Render an isolated tooltip in the real Minecraft client and exit (requires a display)"
run = "./gradlew runItemSmoke"
run_windows = "cmd.exe /d /c gradlew.bat runItemSmoke"

[tasks.test-release]
description = "Test the version/artifact/Discord release helpers without sending a message"
run = "python ci/test_release.py"

[tasks.build]
description = "Build and remap Odyssey without installing it into PrismLauncher"
run = "./gradlew build"
run_windows = "cmd.exe /d /c gradlew.bat build"

[tasks.dev-client]
description = "Launch the Fabric development client"
env.ODYSSEY_DEVELOPMENT = "true"
run = "./gradlew runClient"
run_windows = "cmd.exe /d /c gradlew.bat runClient"

[tasks.ci]
description = "Run workflow lint and the complete Gradle build/test graph"
depends = ["workflow-lint", "test-release", "build-ci"]

[tasks.build-ci]
description = "Build, test, and bundle compiled cross-platform updater checks"
run = "./gradlew ci"
run_windows = "cmd.exe /d /c gradlew.bat ci"

[tasks.test-native]
description = "Run the compiled updater checks without Gradle or Minecraft"
run = "python ci/native_tests.py"

[tasks.release-version]
description = "Validate a release tag and print its SemVer value"
run = "python ci/release.py version"

[tasks.release-artifact]
description = "Validate the remapped build JAR and write its provenance record"
run = "python ci/release.py artifact"

[tasks.verify-release-artifact]
description = "Verify a promoted JAR against its build provenance record"
run = "python ci/release.py verify-artifact"

[tasks.release-announce]
description = "Announce a GitHub release to Discord and verify the message and attachments"
run = "python ci/release.py announce"

[tasks.publisher-preflight]
description = "Authenticate the bot publisher without posting a message"
run = "python ci/release.py preflight"

[tasks.update-manifest]
description = "Create compatibility metadata for a stable release"
run = "python ci/update_manifest.py"

[tasks.sign-update-manifest]
description = "Sign and verify a release manifest using the publisher's private key"
run = "java ci/ReleaseSigner.java"

[tasks.install]
description = "Install the production build into the configured PrismLauncher instance"
depends = ["build"]
run = "python ci/local.py install"

[tasks.menu]
description = "Install Odyssey and open the configured PrismLauncher instance"
depends = ["install"]
run = "python ci/local.py menu"

[tasks.launch]
description = "Install Odyssey and connect the configured instance to Wynncraft"
depends = ["install"]
run = "python ci/local.py launch"
